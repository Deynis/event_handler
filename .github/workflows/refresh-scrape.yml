name: Rafraîchir les événements

on:
  schedule:
    # Un passage par semaine, le lundi (heure UTC, soit ~5h à Paris).
    - cron: "17 3 * * 1"
  workflow_dispatch:   # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: events-json
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Le scraping peut échouer sans empêcher la purge ni le commit :
      # l'échec est signalé à la dernière étape.
      - name: Scraping + purge
        id: scrape
        continue-on-error: true
        run: python scripts/scrape_sources.py

      - name: Commit si le fichier a changé
        run: |
          if git diff --quiet -- data/events.json data/philharmonie-cache.json && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/philharmonie-cache.json
          git commit -m "Mise à jour automatique des événements"
          git pull --rebase
          git push

      - name: Signaler un échec de scraping
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Au moins une source n'a pas pu être lue (voir l'étape « Scraping + purge »). Les données précédentes ont été conservées."
          exit 1
