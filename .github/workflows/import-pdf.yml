name: Importer le programme PDF de La Scala

on:
  push:
    paths:
      - "pdf/**"
  workflow_dispatch:   # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: events-json
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Traite tous les PDF du dossier pdf/ : chacun remplace les séances de sa semaine.
      # Les semaines passées sont purgées aussitôt, donc rejouer d'anciens PDF est sans risque.
      - name: Extraction + purge
        run: python scripts/extract_pdf.py

      - name: Commit si le fichier a changé
        run: |
          if git diff --quiet -- data/events.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Import du programme PDF de La Scala"
          git pull --rebase
          git push
